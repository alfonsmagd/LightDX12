name: Compile and CTest Windows CMake

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect Changed Areas
    runs-on: windows-2025
    outputs:
      engine: ${{ steps.filter.outputs.engine }}
      tests: ${{ steps.filter.outputs.tests }}
      app: ${{ steps.filter.outputs.app }}
      examples: ${{ steps.filter.outputs.examples }}
      cmake: ${{ steps.filter.outputs.cmake }}
      nuget: ${{ steps.filter.outputs.nuget }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect changed areas
        id: filter
        shell: pwsh
        run: |
          if ( "${{ github.event_name }}" -eq "pull_request" ) {
              $baseSha = "${{ github.event.pull_request.base.sha }}"
              $targetSha = "${{ github.event.pull_request.head.sha }}"
          } else {
              $baseSha = "${{ github.event.before }}"
              $targetSha = "$env:GITHUB_SHA"
          }

          $zeroSha = "0000000000000000000000000000000000000000"
          if ( [string]::IsNullOrWhiteSpace( $baseSha ) -or $baseSha -eq $zeroSha ) {
              $changedFiles = @( git ls-tree -r --name-only $targetSha )
          } else {
              git cat-file -e "$baseSha^{commit}" 2>$null
              if ( $LASTEXITCODE -eq 0 ) {
                  $changedFiles = @( git diff --name-only $baseSha $targetSha )
              } else {
                  $changedFiles = @( git ls-tree -r --name-only $targetSha )
              }
          }

          function Test-PathChange( [string[]] $patterns ) {
              foreach ( $changedFile in $changedFiles ) {
                  foreach ( $pattern in $patterns ) {
                      if ( $changedFile -like $pattern ) {
                          return $true
                      }
                  }
              }
              return $false
          }

          $engineChanged = Test-PathChange @(
              "Ldx12/*",
              "CMakeLists.txt",
              "cmake/Ldx12BaseMipsShader.hpp.in",
              "GenerateSolution.bat",
              ".github/workflows/compile-and-ctest-windows-cmake.yml"
          )
          $testsChanged = Test-PathChange @(
              "tests/Ldx12/*",
              "tests/Ldx12Tests.cpp",
              "tests/Ldx12StressTests.cpp",
              "tests/Ldx12FrameStressTests.cpp",
              "tests/Ldx12CommandStreamStressTests.cpp",
              "tests/Ldx12FullCapacityTests.cpp"
          )
          $appChanged = Test-PathChange @(
              "App/*",
              "third_party/imgui/*",
              "tests/NodeGraphTests.cpp"
          )
          $examplesChanged = Test-PathChange @(
              "samples/*"
          )
          $cmakeChanged = Test-PathChange @(
              "cmake/Ldx12Config.cmake.in",
              "examples/InstalledLdx12/*",
              "tests/cmake/*"
          )
          $nugetChanged = Test-PathChange @(
              "nuget/*",
              "tests/nuget/*",
              "LICENSE*"
          )

          "engine=$($engineChanged.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          "tests=$($testsChanged.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          "app=$($appChanged.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          "examples=$($examplesChanged.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          "cmake=$($cmakeChanged.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          "nuget=$($nugetChanged.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT

          $changedFiles | ForEach-Object { Write-Host "Changed: $_" }

  ldx12-tests:
    name: Ldx12 Core and Tests
    needs: changes
    if: needs.changes.outputs.engine == 'true' || needs.changes.outputs.tests == 'true'
    runs-on: windows-2025
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Configure core tests
        run: >-
          cmake -S . -B build-core-tests
          -DLDX12_BUILD_APP=OFF
          -DLDX12_BUILD_EXAMPLES=OFF
          -DLDX12_BUILD_TESTS=ON
          -DLDX12_INSTALL=OFF

      - name: Build core tests
        run: cmake --build build-core-tests --config Debug --target Ldx12Tests Ldx12StressTests Ldx12FrameStressTests Ldx12CommandStreamStressTests Ldx12FullCapacityTests --parallel

      - name: Run core tests
        run: ctest --test-dir build-core-tests -C Debug --output-on-failure

  cmake-compatibility:
    name: CMake ${{ matrix.cmake-version }} Compatibility
    needs: changes
    if: needs.changes.outputs.engine == 'true' || needs.changes.outputs.cmake == 'true'
    runs-on: windows-2025
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        cmake-version:
          - "3.24.4"
          - latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Configure MSVC environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install CMake ${{ matrix.cmake-version }}
        uses: lukka/get-cmake@latest
        with:
          cmakeVersion: ${{ matrix.cmake-version }}

      - name: Report CMake version
        run: cmake --version

      - name: Configure source consumer
        run: cmake -S tests/cmake/source-consumer -B build-source-consumer -G Ninja -DCMAKE_BUILD_TYPE=Debug

      - name: Build source consumer
        run: cmake --build build-source-consumer --parallel

      - name: Run source consumer
        run: ctest --test-dir build-source-consumer --output-on-failure

      - name: Configure core-only package
        run: >-
          cmake -S . -B build-core
          -DLDX12_BUILD_APP=OFF
          -DLDX12_BUILD_EXAMPLES=OFF
          -DLDX12_BUILD_TESTS=OFF
          -DLDX12_INSTALL=ON
          -G Ninja
          -DCMAKE_BUILD_TYPE=Debug

      - name: Build core-only package
        run: cmake --build build-core --target Ldx12 --parallel

      - name: Install Ldx12 package
        run: |
          $installPrefix = Join-Path $env:RUNNER_TEMP "Ldx12-install"
          cmake --install build-core --prefix $installPrefix
          "LDX12_INSTALL_PREFIX=$installPrefix" >> $env:GITHUB_ENV

      - name: Configure installed consumer
        run: cmake -S examples/InstalledLdx12 -B build-install-consumer -G Ninja -DCMAKE_BUILD_TYPE=Debug -DCMAKE_PREFIX_PATH="$env:LDX12_INSTALL_PREFIX"

      - name: Build installed consumer
        run: cmake --build build-install-consumer --parallel

      - name: Run installed consumer
        run: ctest --test-dir build-install-consumer --output-on-failure

      - name: Configure FetchContent consumer
        run: cmake -S tests/cmake/fetch-consumer -B build-fetch-consumer -G Ninja -DCMAKE_BUILD_TYPE=Debug

      - name: Build FetchContent consumer
        run: cmake --build build-fetch-consumer --parallel

      - name: Run FetchContent consumer
        run: ctest --test-dir build-fetch-consumer --output-on-failure

  nuget-package:
    name: NuGet Package and VS2022 Consumer
    needs: changes
    if: needs.changes.outputs.engine == 'true' || needs.changes.outputs.nuget == 'true' || startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-2025
    timeout-minutes: 20
    outputs:
      version: ${{ steps.package.outputs.version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Configure NuGet.exe
        uses: NuGet/setup-nuget@v4
        with:
          nuget-version: latest

      - name: Build NuGet package
        id: package
        shell: pwsh
        run: |
          if ( $env:GITHUB_REF_TYPE -eq "tag" ) {
              $version = $env:GITHUB_REF_NAME -replace '^v', ''
          } else {
              $version = "0.1.0-ci.$env:GITHUB_RUN_NUMBER"
          }

          ./nuget/Pack.ps1 -Version $version -NuGetExe ( Get-Command nuget.exe ).Source
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Test package in a VS2022 project
        shell: pwsh
        run: ./nuget/TestPackage.ps1 -Version "${{ steps.package.outputs.version }}" -NuGetExe ( Get-Command nuget.exe ).Source

      - name: Upload NuGet package
        uses: actions/upload-artifact@v7
        with:
          name: Ldx12-nuget-${{ steps.package.outputs.version }}
          path: packages/Ldx12.${{ steps.package.outputs.version }}.nupkg
          if-no-files-found: error

  publish-nuget:
    name: Publish NuGet.org Package
    needs:
      - changes
      - nuget-package
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-2025
    timeout-minutes: 10
    environment: release
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Download NuGet package
        uses: actions/download-artifact@v7
        with:
          name: Ldx12-nuget-${{ needs.nuget-package.outputs.version }}
          path: packages

      - name: NuGet login
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Publish package
        shell: pwsh
        run: >-
          dotnet nuget push
          "packages/Ldx12.${{ needs.nuget-package.outputs.version }}.nupkg"
          --api-key "${{ steps.login.outputs.NUGET_API_KEY }}"
          --source https://api.nuget.org/v3/index.json

  app:
    name: App and Tests
    needs: changes
    if: needs.changes.outputs.engine == 'true' || needs.changes.outputs.app == 'true'
    runs-on: windows-2025
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Configure App
        run: >-
          cmake -S . -B build-app
          -DLDX12_BUILD_APP=ON
          -DLDX12_BUILD_EXAMPLES=OFF
          -DLDX12_BUILD_TESTS=ON
          -DLDX12_INSTALL=OFF

      - name: Build App
        run: cmake --build build-app --config Debug --target App Ldx12NodeGraphTests --parallel

      - name: Run App tests
        run: ctest --test-dir build-app -C Debug -R "^Ldx12NodeGraphTests$" --output-on-failure

  examples:
    name: Examples
    needs: changes
    if: needs.changes.outputs.engine == 'true' || needs.changes.outputs.examples == 'true'
    runs-on: windows-2025
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Configure examples
        run: >-
          cmake -S . -B build-examples
          -DLDX12_BUILD_APP=ON
          -DLDX12_BUILD_EXAMPLES=ON
          -DLDX12_BUILD_TESTS=OFF
          -DLDX12_INSTALL=OFF

      - name: Build examples
        run: cmake --build build-examples --config Debug --parallel
