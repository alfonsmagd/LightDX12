name: Compile and CTest Windows CMake

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ldx12-tests:
    name: Ldx12 Core and Tests
    runs-on: windows-2025
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Configure core tests
        run: >-
          cmake -S . -B build-core-tests
          -DLDX12_BUILD_APP=OFF
          -DLDX12_BUILD_EXAMPLES=OFF
          -DLDX12_BUILD_TESTS=ON
          -DLDX12_INSTALL=OFF

      - name: Build core tests
        run: cmake --build build-core-tests --config Debug --target Ldx12Tests Ldx12StressTests Ldx12FrameStressTests Ldx12CommandStreamStressTests --parallel

      - name: Run core tests
        run: ctest --test-dir build-core-tests -C Debug --output-on-failure

  cmake-compatibility:
    name: CMake ${{ matrix.cmake-version }} Compatibility
    runs-on: windows-2025
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        cmake-version:
          - "3.24.4"
          - latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Configure MSVC environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install CMake ${{ matrix.cmake-version }}
        uses: lukka/get-cmake@latest
        with:
          cmakeVersion: ${{ matrix.cmake-version }}

      - name: Report CMake version
        run: cmake --version

      - name: Configure source consumer
        run: cmake -S tests/cmake/source-consumer -B build-source-consumer -G Ninja -DCMAKE_BUILD_TYPE=Debug

      - name: Build source consumer
        run: cmake --build build-source-consumer --parallel

      - name: Run source consumer
        run: ctest --test-dir build-source-consumer --output-on-failure

      - name: Configure core-only package
        run: >-
          cmake -S . -B build-core
          -DLDX12_BUILD_APP=OFF
          -DLDX12_BUILD_EXAMPLES=OFF
          -DLDX12_BUILD_TESTS=OFF
          -DLDX12_INSTALL=ON
          -G Ninja
          -DCMAKE_BUILD_TYPE=Debug

      - name: Build core-only package
        run: cmake --build build-core --target Ldx12 --parallel

      - name: Install Ldx12 package
        run: |
          $installPrefix = Join-Path $env:RUNNER_TEMP "Ldx12-install"
          cmake --install build-core --prefix $installPrefix
          "LDX12_INSTALL_PREFIX=$installPrefix" >> $env:GITHUB_ENV

      - name: Configure installed consumer
        run: cmake -S examples/InstalledLdx12 -B build-install-consumer -G Ninja -DCMAKE_BUILD_TYPE=Debug -DCMAKE_PREFIX_PATH="$env:LDX12_INSTALL_PREFIX"

      - name: Build installed consumer
        run: cmake --build build-install-consumer --parallel

      - name: Run installed consumer
        run: ctest --test-dir build-install-consumer --output-on-failure

      - name: Configure FetchContent consumer
        run: cmake -S examples/InstalledLdx12 -B build-fetch-consumer -G Ninja -DCMAKE_BUILD_TYPE=Debug -DLDX12_USE_FETCHCONTENT=ON

      - name: Build FetchContent consumer
        run: cmake --build build-fetch-consumer --parallel

      - name: Run FetchContent consumer
        run: ctest --test-dir build-fetch-consumer --output-on-failure

  examples:
    name: App and Examples
    runs-on: windows-2025
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Configure examples
        run: >-
          cmake -S . -B build-examples
          -DLDX12_BUILD_APP=ON
          -DLDX12_BUILD_EXAMPLES=ON
          -DLDX12_BUILD_TESTS=OFF
          -DLDX12_INSTALL=OFF

      - name: Build examples
        run: cmake --build build-examples --config Debug --parallel
